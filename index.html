<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xforum | Topluluk Platformu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            line-height: 1.6;
        }
        header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
            text-decoration: none;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .new-post-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        input, textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }
        button:hover {
            background-color: #2ea043;
        }
        .post-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }
        .post-title {
            color: #58a6ff;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .post-meta {
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Xforum</a>
        <span style="font-size: 0.9rem; color: #8b949e;">Hoş Geldiniz</span>
    </header>

    <div class="container">
        <!-- Yeni Konu Açma Alanı -->
        <div class="new-post-box">
            <h3 style="margin-bottom: 0.8rem; font-size: 1.1rem;">Yeni Konu Başlat</h3>
            <input type="text" id="postTitle" placeholder="Konu başlığını buraya yazın...">
            <textarea id="postContent" rows="3" placeholder="Mesajınızı veya sorunuzu yazın..."></textarea>
            <button onclick="addPost()">Konuyu Yayınla</button>
        </div>

        <!-- Konu Listesi -->
        <div id="postsList">
            <div class="post-card">
                <div class="post-title">Xforum'a Hoş Geldiniz!</div>
                <div class="post-meta">Admin • Az önce</div>
                <p>Bu site GitHub Pages üzerinde barındırılmaktadır. Yukarıdaki kutucuktan yeni konular oluşturup test edebilirsiniz.</p>
            </div>
        </div>
    </div>

    <script>
        function addPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!title || !content) {
                alert("Lütfen başlık ve içerik alanlarını doldurun.");
                return;
            }

            const postsList = document.getElementById('postsList');
            const newCard = document.createElement('div');
            newCard.className = 'post-card';
            newCard.innerHTML = `
                <div class="post-title">${escapeHTML(title)}</div>
                <div class="post-meta">Kullanıcı • Şimdi</div>
                <p>${escapeHTML(content)}</p>
            `;

            postsList.prepend(newCard);
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
        }
    </script>

</body>
</html>
